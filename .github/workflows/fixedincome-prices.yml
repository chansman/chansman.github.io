name: Update fixed income prices

on:
  schedule:
    # 03:00 UTC Tue-Sat = 11pm EDT / 10pm EST Mon-Fri. FedInvest posts its
    # end-of-day prices late in the evening, and an earlier run often missed them.
    - cron: "0 3 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch prices
        run: python3 fixedincome/scripts/update_prices.py
      - name: Commit new prices
        run: |
          if git diff --quiet -- fixedincome/data/prices.json; then
            echo "No new prices."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add fixedincome/data/prices.json
          git commit -m "Update fixed income prices"
          git push
