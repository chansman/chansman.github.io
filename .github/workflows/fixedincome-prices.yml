name: Update fixed income prices

on:
  schedule:
    # FedInvest posts a day's end-of-day price the next business morning, so
    # run hourly from 13:23 to 16:23 UTC (9:23am-12:23pm EDT, 8:23-11:23am EST)
    # to pick it up soon after it appears. GitHub often starts scheduled runs
    # hours late, and an odd minute avoids the top-of-hour queue. The script
    # commits only when it finds new data.
    - cron: "23 13-16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch prices
        run: python3 fixedincome/scripts/update_prices.py
      - name: Commit new prices
        run: |
          if git diff --quiet -- fixedincome/data/prices.json; then
            echo "No new prices."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add fixedincome/data/prices.json
          git commit -m "Update fixed income prices"
          git push
