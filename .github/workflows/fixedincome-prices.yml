name: Update fixed income prices

on:
  schedule:
    # 22:30 UTC on weekdays = 6:30pm EDT / 5:30pm EST, after the market close
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch prices
        run: python3 fixedincome/scripts/update_prices.py
      - name: Commit new prices
        run: |
          if git diff --quiet -- fixedincome/data/prices.json; then
            echo "No new prices."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add fixedincome/data/prices.json
          git commit -m "Update fixed income prices"
          git push
