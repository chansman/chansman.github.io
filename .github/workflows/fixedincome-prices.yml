name: Update fixed income prices

on:
  schedule:
    # 03:00 UTC = 11pm EDT / 10pm EST, after FedInvest usually posts its close.
    # 13:00 UTC = 9am EDT / 8am EST, to catch a close the overnight run missed.
    # Both run every day, so a missed Friday close is picked up on Saturday
    # instead of Monday night. The script commits only when it finds new data.
    - cron: "0 3,13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch prices
        run: python3 fixedincome/scripts/update_prices.py
      - name: Commit new prices
        run: |
          if git diff --quiet -- fixedincome/data/prices.json; then
            echo "No new prices."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add fixedincome/data/prices.json
          git commit -m "Update fixed income prices"
          git push
